function b64(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

  msg.textContent = 'იშიფრება...';

  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.it, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct)
    );
    const html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    // AES-GCM fails authentication on a wrong key, so this is the "wrong code" path
    msg.className = 'msg';
    msg.textContent = 'კოდი არასწორია.';
    btn.disabled = false;
    pw.value = '';
    pw.focus();
  }
});
</script>
</body>
</html>
